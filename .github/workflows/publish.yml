name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
      integrity: ${{ steps.package.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.name, 'pi-transcript-ui');
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert(pkg.keywords.includes('pi-package'));
          assert.equal(pkg.repository.url, 'git+https://github.com/isty2e/pi-transcript-ui.git');
          if (process.env.GITHUB_EVENT_NAME === 'release') {
            assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
            assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          }
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ejx537/pi-alternative-compositor
          ref: 0ce06f33b34c63604766560e56b03373ce0e7a2c
          path: .ci/alternative-compositor
          persist-credentials: false
      - run: npm ci
      - name: Isolate the compositor fixture from test discovery
        run: |
          mv .ci/alternative-compositor "$RUNNER_TEMP/alternative-compositor"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/alternative-compositor/node_modules"
      - run: npm test
        env:
          PI_ALT_COMPOSITOR_SOURCE: ${{ runner.temp }}/alternative-compositor
      - name: Pack and inspect publication artifact
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package" --json > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const [pack] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-pack.json`, 'utf8'));
          assert.equal(pack.name, pkg.name);
          assert.equal(pack.version, pkg.version);
          assert.equal(pack.filename, `${pkg.name}-${pkg.version}.tgz`);
          assert(pack.files.length > 0);
          assert(pack.files.every(file => /^(src\/|docs\/|README\.md$|LICENSE$|package\.json$)/.test(file.path)));
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${pack.version}\nintegrity=${pack.integrity}\n`);
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.event_name == 'release' && !github.event.release.prerelease && github.repository == 'isty2e/pi-transcript-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Verify and publish the tested artifact
        env:
          PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
          PACKAGE_INTEGRITY: ${{ needs.verify.outputs.integrity }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const path = `${process.env.RUNNER_TEMP}/npm-package/pi-transcript-ui-${process.env.PACKAGE_VERSION}.tgz`;
          const actual = 'sha512-' + createHash('sha512').update(readFileSync(path)).digest('base64');
          assert.equal(actual, process.env.PACKAGE_INTEGRITY);
          JS
          npm publish "$RUNNER_TEMP/npm-package/pi-transcript-ui-$PACKAGE_VERSION.tgz" --access public --registry=https://registry.npmjs.org/ --ignore-scripts
          npm view "pi-transcript-ui@$PACKAGE_VERSION" dist.integrity --json --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/npm-published.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.equal(JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/npm-published.json`, 'utf8')), process.env.PACKAGE_INTEGRITY);
          JS
